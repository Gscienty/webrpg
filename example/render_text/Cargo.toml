[package]
name = "webrpg-render-text-example"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
fontdue = "0.9.4"
renderer = { path = "../../renderer" }
shared = { path = "../../shared" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
] }
