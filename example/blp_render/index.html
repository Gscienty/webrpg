<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebRPG BLP Viewer</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 1rem; color: #eee; background: #18181b; font: 16px system-ui; }
      canvas { width: min(80vw, 768px); height: min(80vw, 768px); border: 1px solid #3f3f46; background: #111; image-rendering: pixelated; }
      #status { min-height: 1.5em; color: #a1a1aa; }
    </style>
  </head>
  <body>
    <input id="file" type="file" accept=".blp" />
    <canvas id="canvas" width="768" height="768"></canvas>
    <div id="status">请选择一个 BLP1 或 BLP2 文件</div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
