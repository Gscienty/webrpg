<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebRPG DrawImage 示例</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 1rem; color: #e4e4e7; background: #18181b; font: 16px system-ui; }
      .inputs { display: flex; flex-wrap: wrap; gap: 1rem; }
      canvas { width: min(80vw, 768px); height: min(80vw, 768px); border: 1px solid #52525b; image-rendering: pixelated; }
      #status { min-height: 1.5em; color: #a1a1aa; }
    </style>
  </head>
  <body>
    <div class="inputs">
      <label>BLP：<input id="blp-file" type="file" accept=".blp" /></label>
      <label>DDS：<input id="dds-file" type="file" accept=".dds" /></label>
      <label>PCX：<input id="pcx-file" type="file" accept=".pcx" /></label>
      <label>TGA：<input id="tga-file" type="file" accept=".tga" /></label>
    </div>
    <canvas id="canvas" width="768" height="768"></canvas>
    <div id="status">请选择 BLP、DDS、PCX 或 TGA 图片</div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
