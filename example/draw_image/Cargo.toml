[package]
name = "webrpg-draw-image-example"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
fileformat = { path = "../../fileformat" }
renderer = { path = "../../renderer" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
] }
