<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebRPG W3M Terrain Parser</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #e5e7eb; background: #0f172a; font: 14px system-ui; }
      main { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; min-height: 100vh; }
      aside { padding: 20px; border-right: 1px solid #334155; background: #111827; overflow: auto; }
      section { min-width: 0; display: grid; place-items: center; padding: 20px; overflow: auto; }
      h1 { margin: 0 0 16px; font-size: 20px; }
      button, .upload { border: 1px solid #475569; border-radius: 6px; padding: 7px 10px; color: inherit; background: #1e293b; cursor: pointer; }
      button:hover, .upload:hover { background: #334155; }
      button:disabled { cursor: default; }
      .upload input { display: none; }
      #archives, #entries { margin: 14px 0; padding: 0; list-style: none; }
      li { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 7px 4px; border-bottom: 1px solid #1f2937; }
      li button:first-child { min-width: 0; flex: 1; overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; border: 0; background: transparent; }
      .danger { color: #fca5a5; }
      #breadcrumbs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 18px; }
      #status { min-height: 3em; color: #94a3b8; white-space: pre-wrap; }
      canvas { width: min(100%, 1000px); height: auto; image-rendering: pixelated; border: 1px solid #334155; background: #090d14; }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid #334155; } }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <h1>MPQ / W3M 地形浏览器</h1>
        <label class="upload">上传地图<input id="upload" type="file" accept=".mpq,.w3m,.w3x" multiple /></label>
        <ul id="archives"></ul>
        <div id="breadcrumbs"></div>
        <ul id="entries"></ul>
        <div id="status">正在读取 OPFS…</div>
      </aside>
      <section><canvas id="canvas" width="1" height="1"></canvas></section>
    </main>
    <script type="module" src="./index.js"></script>
  </body>
</html>
