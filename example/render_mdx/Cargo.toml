[package]
name = "webrpg-render-mdx-example"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
renderer = { path = "../../renderer" }
shared = { path = "../../shared" }
webrpg-mpq = { path = "../../mpq" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
] }
