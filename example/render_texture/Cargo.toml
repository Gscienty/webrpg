[package]
name = "webrpg-example"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3"
renderer = { path = "../../renderer" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "console",
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
] }
