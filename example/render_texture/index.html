<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebRPG Texture Viewer</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 1rem; color: #18181b; background: #fff; font: 16px system-ui; }
      canvas { width: min(80vw, 768px); height: min(80vw, 768px); border: 1px solid #d4d4d8; background: #fff; image-rendering: pixelated; }
      #status { min-height: 1.5em; color: #52525b; }
    </style>
  </head>
  <body>
    <label>BLP：<input id="blp-file" type="file" accept=".blp" /></label>
    <label>DDS：<input id="dds-file" type="file" accept=".dds" /></label>
    <label>PCX：<input id="pcx-file" type="file" accept=".pcx" /></label>
    <label>TGA：<input id="tga-file" type="file" accept=".tga" /></label>
    <canvas id="canvas" width="768" height="768"></canvas>
    <div id="status">请选择一个 BLP、DDS、PCX 或 TGA 文件</div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
