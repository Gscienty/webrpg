[package]
name = "renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
js-sys = "0.3"
jpeg-decoder = { version = "0.3", default-features = false, features = [
  "platform_independent",
] }
shared = { path = "../shared" }
web-sys = { version = "0.3", features = [
  "console",
  "WebGl2RenderingContext",
  "WebglCompressedTextureS3tc",
  "WebGlTexture",
] }
