[package]
name = "renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
fileformat = { path = "../fileformat" }
web-sys = { version = "0.3", features = [
  "console",
  "WebGl2RenderingContext",
  "WebglCompressedTextureS3tc",
  "WebGlTexture",
  "WebGlProgram",
  "WebGlShader",
  "WebGlBuffer",
  "WebGlRenderbuffer",
  "WebGlUniformLocation",
  "WebGlFramebuffer",
  "WebGlTexture",
  "WebGlVertexArrayObject",
  "WebGlTransformFeedback",
  "WebGlContextAttributes",
] }
